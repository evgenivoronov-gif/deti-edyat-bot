name: Keep VK bot awake

on:
  schedule:
    # Каждые 10 минут — не даёт бесплатному инстансу Render уснуть
    # (спит после 15 минут без запросов).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://deti-edyat-vk-bot.onrender.com/ || echo "000")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
