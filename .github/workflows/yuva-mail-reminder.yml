name: Напоминание YUVA — рассылка

on:
  schedule:
    # 9 ноября, 06:50 UTC = 09:50 по Москве (понедельник, перед отправкой 10 писем)
    - cron: "50 6 9 11 *"
  workflow_dispatch: {}

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Отправить напоминание в Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          TEXT="📬 YUVA — напоминание про рассылку

          Сегодня отправляем 10 писем дизайнерам (партия 6 + ещё 5), с 10:00, по одному с паузой 10–20 минут.

          Открой Claude Code и напиши: «продолжим» — я сначала проверю Входящие и Спам, потом покажу письма и отправлю по твоей команде."

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
